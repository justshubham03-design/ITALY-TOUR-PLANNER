services:
  - type: web
    name: italy-tour-planner
    env: python
    buildCommand: 'pip install -r requirements.txt'
    startCommand: 'python3 web/app.py'
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
